<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LingoBrain Mockup</title>
<style>
:root{
  --paper:#F5F7F5;--paper-2:#EDF2EF;--card:#FFFFFF;--ink:#203B3A;--ink-muted:#586D68;--line:#DCE5E1;
  --accent:#176A60;--accent-ink:#FFFFFF;--accent-wash:#E1F2EB;--peach:#F6DBC6;--peach-ink:#84512D;
  --ok:#24734F;--bad:#B13E3E;--bad-wash:#FBE9E7;--hero:#194F49;--shadow:0 1px 2px rgba(20,50,45,.06),0 6px 20px rgba(20,50,45,.06);
  --desk:#E4EAE7;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#101F20;--paper-2:#1E3332;--card:#192C2C;--ink:#E8F2EA;--ink-muted:#B1C5BD;--line:#2B4443;
  --accent:#9BDFC5;--accent-ink:#0E2A26;--accent-wash:#234B40;--peach:#493A30;--peach-ink:#FFD2AF;
  --ok:#A1DBAE;--bad:#FFADA4;--bad-wash:#3E2524;--hero:#1B4640;--shadow:none;--desk:#0A1516;}}
:root[data-theme="dark"]{
  --paper:#101F20;--paper-2:#1E3332;--card:#192C2C;--ink:#E8F2EA;--ink-muted:#B1C5BD;--line:#2B4443;
  --accent:#9BDFC5;--accent-ink:#0E2A26;--accent-wash:#234B40;--peach:#493A30;--peach-ink:#FFD2AF;
  --ok:#A1DBAE;--bad:#FFADA4;--bad-wash:#3E2524;--hero:#1B4640;--shadow:none;--desk:#0A1516;}
*{box-sizing:border-box;margin:0}
body{background:var(--desk);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
.layout{display:flex;gap:40px;justify-content:center;align-items:flex-start;padding:32px 16px}
/* ---------- side panel ---------- */
.panel{width:340px;position:sticky;top:32px}
.panel h1{font-size:22px;line-height:1.25}
.panel .lead{color:var(--ink-muted);font-size:14px;margin:6px 0 18px}
.jump{display:grid;gap:6px}
.jump button{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px;min-height:44px}
.jump button[aria-current="true"]{border-color:var(--accent);background:var(--accent-wash);font-weight:600}
.jump small{color:var(--ink-muted);font-size:12px}
.note{margin-top:18px;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:14px}
.note b{display:block;margin-bottom:6px;font-size:12px;letter-spacing:.06em;color:var(--accent)}
.note ul{padding-left:18px;display:grid;gap:4px}
.theme-row{display:flex;gap:6px;margin-top:14px}
.theme-row button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:13px;min-height:40px}
.theme-row button[aria-pressed="true"]{border-color:var(--accent);font-weight:600}
/* ---------- phone ---------- */
.phone{width:390px;height:844px;flex:none;border-radius:48px;background:var(--paper);position:relative;overflow:hidden;
  box-shadow:0 0 0 10px #1c2a29,0 0 0 11px #3a4a48,0 30px 60px rgba(0,0,0,.25)}
.status{height:47px;display:flex;justify-content:space-between;align-items:center;padding:0 30px;font-size:15px;font-weight:600}
.scroll{position:absolute;inset:47px 0 84px;overflow-y:auto;padding:4px 18px 24px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px 22px}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--ink-muted);position:relative}
.tabbar .ic{width:52px;height:30px;border-radius:15px;display:grid;place-items:center}
.tabbar button[aria-current="page"]{color:var(--accent);font-weight:700}
.tabbar button[aria-current="page"] .ic{background:var(--accent-wash)}
.badge[hidden]{display:none}
.badge{position:absolute;top:-2px;left:calc(50% + 8px);background:var(--bad);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;padding:0 5px;display:grid;place-items:center}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:18px;height:18px}
/* ---------- common ---------- */
.hello{display:flex;justify-content:space-between;align-items:center;margin:8px 0 16px}
.hello h2{font-size:24px;line-height:1.2}
.hello p{font-size:14px;color:var(--ink-muted)}
.streak{display:flex;align-items:center;gap:5px;background:var(--peach);color:var(--peach-ink);font-weight:700;font-size:14px;padding:6px 12px;border-radius:999px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ink-muted);text-transform:uppercase}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;font-weight:700;font-size:17px}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-soft{background:var(--accent-wash);color:var(--accent)}
.btn-line{border:1px solid var(--line);background:var(--card)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 10px}
.sec-h h3{font-size:17px}
.link{color:var(--accent);font-weight:600;font-size:14px;display:flex;align-items:center;gap:2px;min-height:44px}
.muted{color:var(--ink-muted)}
.small{font-size:14px}
/* home */
.session{background:var(--hero);color:#fff;border:0}
.session .eyebrow{color:#BFE3D6}
.session .big{font-size:40px;font-weight:800;line-height:1.1;margin:8px 0 2px}
.session .big small{font-size:18px;font-weight:600;opacity:.85}
.session .split{display:flex;gap:14px;font-size:14px;opacity:.92;margin-bottom:16px}
.session .split span{display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.session .btn{background:#F7DFC8;color:#3C2A1C}
.session .prog{height:8px;border-radius:4px;background:rgba(255,255,255,.18);margin:4px 0 14px;overflow:hidden}
.session .prog i{display:block;height:100%;background:#9BDFC5;border-radius:4px}
.habit{display:flex;gap:12px;align-items:center;padding:14px 16px}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.habit .t{font-weight:600;font-size:15px;line-height:1.3}
.habit .m{font-size:13px;color:var(--ink-muted)}
.habits{padding:0;overflow:hidden}
.habits .habit+.habit{border-top:1px solid var(--line)}
.habit.done .t{text-decoration:line-through;color:var(--ink-muted)}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--accent-wash);color:var(--accent)}
.suggest{display:flex;gap:12px;align-items:center;margin-top:12px}
.suggest .ic{width:44px;height:44px;border-radius:12px;background:var(--accent-wash);color:var(--accent);display:grid;place-items:center;flex:none}
/* play */
.feature{background:linear-gradient(135deg,#2C2250,#4B2F6E);color:#fff;border:0;position:relative;overflow:hidden}
.feature .eyebrow{color:#D9C8FF}
.feature h3{font-size:22px;margin:4px 0 2px}
.feature .row{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.feature .btn{width:auto;padding:0 20px;min-height:46px;background:#FFD87A;color:#3A2A00;font-size:15px}
.feature .orb{position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,#9C7BFF 0,transparent 70%);opacity:.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.game{padding:14px;border-radius:18px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:132px}
.game .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--accent-wash);color:var(--accent)}
.game b{font-size:15px}
.game .p{font-size:13px;color:var(--ink-muted);line-height:1.3}
.game .f{margin-top:auto;display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-muted)}
.game .f .best{color:var(--peach-ink);font-weight:700}
.game.locked{opacity:.62}
.game.locked .ic{background:var(--paper-2);color:var(--ink-muted)}
.lockr{font-size:12px;color:var(--ink-muted);display:flex;gap:4px;align-items:center;margin-top:auto}
.nudge{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--peach);color:var(--peach-ink);font-size:14px;margin-bottom:14px}
.nudge b{margin-left:auto;white-space:nowrap}
/* progress */
.kpis{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.kpi{padding:14px 12px;border-radius:18px}
.kpi b{font-size:26px;display:block;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--ink-muted)}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:10px 0 8px;background:var(--paper-2)}
.stack i:first-child{background:var(--accent)} .stack i:last-child{background:#E3A574}
.legend{display:flex;gap:14px;font-size:13px;color:var(--ink-muted)}
.legend span{display:flex;align-items:center;gap:6px}
.fc{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:110px;margin-top:10px}
.fc div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--ink-muted)}
.fc i{width:100%;border-radius:6px 6px 3px 3px;background:var(--accent);opacity:.45}
.fc .today i{opacity:1}
.fc b{font-size:12px;color:var(--ink)}
.heat{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin-top:10px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--paper-2)}
.heat .l1{background:color-mix(in srgb,var(--accent) 30%,var(--paper-2))}
.heat .l2{background:color-mix(in srgb,var(--accent) 60%,var(--paper-2))}
.heat .l3{background:var(--accent)}
.hl{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:11px;color:var(--ink-muted);margin-top:6px}
.hl i{width:11px;height:11px;border-radius:3px;display:inline-block}
.rowlist{padding:0}
.rowlist .r{display:flex;align-items:center;gap:10px;padding:0 16px;min-height:52px;width:100%;text-align:left}
.rowlist .r+.r{border-top:1px solid var(--line)}
.rowlist .r .x{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--ink-muted);font-size:13px}
.lapse{font-size:12px;font-weight:700;color:var(--bad);background:var(--bad-wash);padding:2px 8px;border-radius:999px}
/* me */
.danger{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.danger .r{color:var(--bad)}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:20px}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center}
.stepper b{min-width:30px;text-align:center}
/* ---------- stage ---------- */
.stage{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column;z-index:40;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.stage[hidden]{display:none}
.sbar{display:flex;align-items:center;gap:10px;padding:4px 14px 8px}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink-muted)}
.sprog{flex:1;height:8px;background:var(--paper-2);border-radius:4px;overflow:hidden}
.sprog i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.count{font-size:14px;font-weight:700;min-width:48px;text-align:right}
.sbody{flex:1;overflow-y:auto;padding:12px 22px 20px;display:flex;flex-direction:column}
.sfoot{padding:12px 18px 34px;background:var(--paper);border-top:1px solid var(--line);display:grid;gap:10px}
.kind{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
.kind .steps{display:flex;gap:4px}
.kind .steps i{width:18px;height:5px;border-radius:3px;background:var(--line)}
.kind .steps i.on{background:var(--accent)}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px}
.sent{font-size:23px;line-height:1.45}
.blank{display:inline-block;width:70px;border-bottom:3px solid var(--accent);transform:translateY(-4px)}
.src{font-size:13px;color:var(--ink-muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tool{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:600}
.vi{padding:12px 14px;border-radius:12px;background:var(--paper-2);font-size:15px}
.word{text-align:center}
.word .emo{font-size:56px;line-height:1}
.word h2{font-size:44px;line-height:1.1;margin-top:8px}
.word .pos{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--paper-2);color:var(--ink-muted);vertical-align:middle;margin-left:6px}
.word .ipa{font-family:ui-monospace,Menlo,monospace;color:var(--ink-muted);margin-top:4px}
.word .mean{font-size:21px;margin-top:10px}
.mnem{padding:12px 14px;border-radius:14px;background:var(--peach);color:var(--peach-ink);font-size:14.5px}
.hi{background:var(--accent-wash);color:var(--accent);font-weight:700;border-radius:4px;padding:0 3px}
.input{min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:0 16px;display:flex;align-items:center;font-size:18px;color:var(--ink-muted)}
.input.typed{color:var(--ink);border-color:var(--accent)}
.feedback{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--accent-wash);color:var(--ok);font-weight:600}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.g{border-radius:14px;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--card)}
.g small{font-weight:500;font-size:12px;color:var(--ink-muted)}
.g0{color:var(--bad)} .g2{border-color:var(--accent);background:var(--accent-wash);color:var(--accent)}
.sum{text-align:center}
.ring{width:132px;height:132px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) 0 88%,var(--paper-2) 0)}
.ring div{width:106px;height:106px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:30px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{display:flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600}
.statline{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.statline div{padding:12px 6px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.statline b{display:block;font-size:20px}
.statline span{font-size:12px;color:var(--ink-muted)}
.anno{position:absolute;z-index:20;right:10px;background:#FFE58A;color:#3A2E00;font-size:12px;font-weight:600;padding:4px 9px;border-radius:8px;box-shadow:0 3px 10px rgba(0,0,0,.18);pointer-events:none;max-width:210px;line-height:1.3}
body.no-anno .anno{display:none}
@media (max-width:820px){
  .layout{flex-direction:column;align-items:center;padding:16px}
  .panel{position:static;width:100%;max-width:390px;order:2}
}
@media (max-width:430px){
  .phone{width:100%;height:calc(100dvh - 32px);min-height:640px;border-radius:28px;box-shadow:0 0 0 1px var(--line)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="layout">
  <aside class="panel">
    <h1>LingoBrain · UX mới</h1>
    <p class="lead">Mockup bấm được. Bấm trực tiếp trong điện thoại hoặc nhảy nhanh bằng danh sách. Nhãn vàng = điểm thay đổi so với bản hiện tại.</p>
    <div class="jump" id="jump"></div>
    <div class="theme-row" role="group" aria-label="Giao diện">
      <button data-theme-set="auto" aria-pressed="true">Theo máy</button>
      <button data-theme-set="light" aria-pressed="false">Sáng</button>

  stage.hidden = !S.stage;
  if (S.stage) renderStage();
  document.getElementById('scroll').innerHTML = TABS[S.tab]();
  document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-current', b.dataset.tab === S.tab ? 'page' : 'false'));
  document.getElementById('badge').hidden = S.done;
  const key = S.stage || (S.tab === 'home' && S.done ? 'homeDone' : S.tab);
  document.querySelectorAll('#jump button').forEach(b => b.setAttribute('aria-current', b.dataset.jump === key));
  const [t, sub, items] = NOTES[key];
  document.getElementById('note').innerHTML = `<b>${t.toUpperCase()}</b><div style="font-weight:600;margin-bottom:6px">${sub}</div><ul>${items.map(i => `<li>${i}</li>`).join('')}</ul>`;
}
function jump(key) {
  STAGE.test.typed = false;
  if (key === 'homeDone') { S.tab = 'home'; S.done = true; S.stage = null; }
  else if (STAGE[key]) { S.stage = key; }
  else { S.tab = key; S.stage = null; if (key === 'home') S.done = false; }
  render();
}

document.getElementById('jump').innerHTML = JUMP.map(([k, l]) => `<button data-jump="${k}">${l}<small>${STAGE[k] ? 'toàn màn' : 'tab'}</small></button>`).join('');
document.addEventListener('click', e => {
  const j = e.target.closest('[data-jump]'); if (j) return jump(j.dataset.jump);
  const t = e.target.closest('[data-tab]'); if (t) { S.tab = t.dataset.tab; S.stage = null; document.getElementById('scroll').scrollTop = 0; return render(); }
  const th = e.target.closest('[data-theme-set]');
  if (th) {
    const v = th.dataset.themeSet;
    if (v === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = v;
    document.querySelectorAll('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', b === th));
    return;
  }
  if (e.target.closest('#toggleAnno')) {
    const on = document.body.classList.toggle('no-anno');
    e.target.closest('#toggleAnno').setAttribute('aria-pressed', !on);
    return;
  }
  if (e.target.closest('#stageClose')) { S.stage = null; return render(); }
  const g = e.target.closest('[data-go]'); if (!g) return;
  const go = g.dataset.go;
  if (go === 'habits') { S.habitsOpen = !S.habitsOpen; return render(); }
  if (go === 'vi') { document.getElementById('vi').hidden = false; g.hidden = true; return; }
  if (go === 'type') { STAGE.test.typed = true; return renderStage(); }
  if (go === 'finish') { S.stage = null; S.done = true; S.tab = 'home'; return render(); }
  if (go === 'more') { S.done = false; return jump('s1'); }
  if (go === 'inc' || go === 'dec') { S.newPerDay = Math.min(50, Math.max(1, S.newPerDay + (go === 'inc' ? 1 : -1))); document.getElementById('npd').textContent = S.newPerDay; return; }
  if (STAGE[go]) { STAGE.test.typed = false; S.stage = go; return render(); }
});
render();
</script>
</body>
