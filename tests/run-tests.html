<script src="game-particles.test.js"></script>
<script>
(async () => {
  // mỗi mục là hàm hoặc {name, fn} (giống tests/run-tests.js)
  for (const t of (window.__asyncTests || [])) {
    const name = t.name || 'async', fn = t.fn || t;
    try { await fn(); it(name, () => {}); } catch (e) { it(name, () => { throw e; }); }
  }
  const lines = [];
  const ok = __reportTests(s => lines.push(s));
  document.getElementById('out').innerHTML = lines.map(l => '<div class="' + (l.startsWith('FAIL') ? 'f' : l.startsWith('PASS') ? 'p' : '') + '">' + l.replace(/</g, '&lt;') + '</div>').join('');
  document.title = (ok ? 'PASS' : 'FAIL') + ' — LingoBrain tests';
})();
</script></body></html>
